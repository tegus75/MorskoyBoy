plugins { id 'com.android.application' }

android {
    namespace 'com.naval.battleship'
    compileSdk 35

    defaultConfig {
        applicationId "com.naval.battleship"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}